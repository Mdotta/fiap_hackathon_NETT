apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: solidary
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: solidary-worker:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef: { name: solidary-config }
            - secretRef: { name: solidary-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8081 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8081 }
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: solidary
spec:
  # ClusterIP (default) — Worker is not exposed externally, only reachable in-cluster
  # (Prometheus scrapes it at worker:8081).
  selector: { app: worker }
  ports:
    - port: 8081
      targetPort: 8081
