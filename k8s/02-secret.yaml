# Dev-only values — the same ones already committed in appsettings.json / docker-compose.yml
# for local development. Not real secrets; kept as a Secret (not the ConfigMap) purely to model
# the right pattern (credentials/signing keys separated from plain config).
apiVersion: v1
kind: Secret
metadata:
  name: solidary-secrets
  namespace: solidary
type: Opaque
stringData:
  ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=solidary;Username=solidary;Password=solidary"
  Jwt__SigningKey: "secret_01M0QY2P0D2Q0Y1Q45BVDS1TKK"
  POSTGRES_USER: "solidary"
  POSTGRES_PASSWORD: "solidary"
  POSTGRES_DB: "solidary"
