apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: solidary
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: solidary-api
        metrics_path: /metrics
        static_configs:
          - targets: ["api:8080"]

      - job_name: solidary-worker
        metrics_path: /metrics
        static_configs:
          - targets: ["worker:8081"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: solidary
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: solidary
spec:
  selector: { app: prometheus }
  ports:
    - port: 9090
      targetPort: 9090
