apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: solidary
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: solidary-api:latest
          # Image only exists in Minikube's own Docker daemon (built via `eval $(minikube docker-env)`)
          # — without this, Kubernetes tries to pull it from a registry and fails.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: solidary-config }
            - secretRef: { name: solidary-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: solidary
spec:
  type: NodePort
  selector: { app: api }
  ports:
    - port: 8080
      targetPort: 8080
